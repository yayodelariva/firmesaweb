name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The curation branches, published beside main so the versions can be
  # compared in a browser. This workflow never merges them — it only builds
  # them. One per line: the branch, then the subdirectory it is served from.
  PREVIEWS: |
    edits/seleccion-v4 v4
    edits/estaciones-v5 v5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The previews check out other branches, so not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Each preview builds in its own worktree, with its own install, so no
      # branch can see another's files. `base` has to carry the subdirectory,
      # or every link and asset in a preview would point at main's copy.
      #
      # A broken preview must not stop main from shipping, hence
      # continue-on-error: the step is flagged in the run, main deploys anyway,
      # and that version is simply absent until the next build succeeds.
      - name: Build the preview branches
        continue-on-error: true
        run: |
          echo "$PREVIEWS" | while read -r rama dir; do
            [ -n "$rama" ] || continue
            echo "::group::$rama → /$dir/"
            git worktree add "../preview-$dir" "origin/$rama"
            ( cd "../preview-$dir"
              npm ci
              BASE_PATH="/${GITHUB_REPOSITORY#*/}/$dir/" \
                npm run build -- --outDir "$GITHUB_WORKSPACE/dist/$dir" )
            echo "::endgroup::"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
